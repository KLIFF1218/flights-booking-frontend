# MaxAirline frontend (dev)
#
# Prerequisites: backend API reachable at NEXT_PUBLIC_API_URL (default http://localhost:3001).
#
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost

x-frontend-healthcheck: &frontend-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  frontend:
    container_name: max-airline-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:80:3000'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./messages:/app/messages
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./next.config.ts:/app/next.config.ts:ro
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      <<: *frontend-healthcheck
      start_period: 180s

volumes:
  frontend_node_modules:
